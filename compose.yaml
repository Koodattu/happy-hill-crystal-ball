name: happy-hill-crystal-ball

services:
  web:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
